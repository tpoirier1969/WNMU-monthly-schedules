name: Fix v1.5.107 import links
on:
  push:
    branches:
      - fix/v1.5.107-import-link-cache
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.5.107-import-link-cache
      - name: Update stale import links and clean workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'month-builder.v1.4.1.html?v=1.5.98'
          new = 'month-builder.v1.4.1.html?v=1.5.107'
          for name in ['index131.v1.4.1.html','index133.v1.4.1.html']:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{old} not found in {name}')
              p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/fix-import-link-v15107.yml
          git config user.name 'WNMU Monthly release bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index131.v1.4.1.html index133.v1.4.1.html
          git commit -m 'Update Import months links to v1.5.107'
          git push
