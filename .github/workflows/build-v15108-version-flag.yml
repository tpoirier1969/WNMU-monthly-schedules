name: Build v1.5.108 version flag only

on:
  push:
    branches:
      - update/v1.5.108-version-flag-only

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: update/v1.5.108-version-flag-only
          fetch-depth: 0

      - name: Update only the visible package flag
        shell: bash
        run: |
          set -euo pipefail

          cp wnmu-version-flag.v1.5.98.js wnmu-version-flag.v1.5.108.js
          sed -i "s/const PACKAGE_VERSION = 'v1.5.98';/const PACKAGE_VERSION = 'v1.5.108';/" wnmu-version-flag.v1.5.108.js
          sed -i "s/const PACKAGE_LABEL = 'strict import parser and persistent auto-tags';/const PACKAGE_LABEL = 'deferred right-click menu save and custom planning tag fix';/" wnmu-version-flag.v1.5.108.js

          sed -i 's/wnmu-version-flag\.v1\.5\.98\.js?v=1\.5\.98/wnmu-version-flag.v1.5.108.js?v=1.5.108/' index131.v1.4.1.html
          sed -i 's/wnmu-version-flag\.v1\.5\.98\.js?v=1\.5\.98/wnmu-version-flag.v1.5.108.js?v=1.5.108/' index133.v1.4.1.html

          node --check wnmu-version-flag.v1.5.108.js
          grep -q 'wnmu-version-flag.v1.5.108.js?v=1.5.108' index131.v1.4.1.html
          grep -q 'wnmu-version-flag.v1.5.108.js?v=1.5.108' index133.v1.4.1.html

      - name: Commit only version-display files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v15108-version-flag.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "WNMU Monthly release bot"
          git config user.email "actions@users.noreply.github.com"
          git add index131.v1.4.1.html index133.v1.4.1.html wnmu-version-flag.v1.5.108.js
          git add -u .github 2>/dev/null || true
          git commit -m "Show v1.5.108 on live schedule pages"
          git push origin HEAD:update/v1.5.108-version-flag-only
