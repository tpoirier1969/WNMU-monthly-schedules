name: Build v1.5.108 menu update

on:
  push:
    branches:
      - update/v1.5.108-menu-deferred-save

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: update/v1.5.108-menu-deferred-save
          fetch-depth: 0

      - name: Build and verify right-click menu update
        shell: bash
        run: |
          set -euo pipefail
          cp wnmu-cell-interactions.v1.5.93.js wnmu-cell-interactions.v1.5.108.js
          cp wnmu-manual-program-overrides.v1.5.93.js wnmu-manual-program-overrides.v1.5.108.js
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/cell108.patch
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/manual108.patch
          patch -p1 < /tmp/cell108.patch
          patch -p1 < /tmp/manual108.patch

          python3 - <<'PY2'
          from pathlib import Path
          for name in ('index131.v1.4.1.html', 'index133.v1.4.1.html'):
              p = Path(name)
              t = p.read_text()
              t = t.replace('wnmu-cell-interactions.v1.5.93.js?v=1.5.93', 'wnmu-cell-interactions.v1.5.108.js?v=1.5.108')
              t = t.replace('wnmu-manual-program-overrides.v1.5.93.js?v=1.5.93', 'wnmu-manual-program-overrides.v1.5.108.js?v=1.5.108')
              if 'month-builder.v1.4.1.html?v=1.5.107' not in t:
                  raise SystemExit(f'{name}: current Month Builder v1.5.107 link was not preserved')
              p.write_text(t)
          PY2

          echo 'd545d3b83e0ed35bb778ecad9ae763f00ee363b9d1fa91c4c6a2146a10c64235  wnmu-cell-interactions.v1.5.108.js' | sha256sum -c -
          echo '45faf33c27df06ad354f9910c33dd0cbc2e13580bbf285ad4b17b03a81f75eac  wnmu-manual-program-overrides.v1.5.108.js' | sha256sum -c -
          test "$(wc -c < wnmu-cell-interactions.v1.5.108.js)" -eq 65328
          test "$(wc -c < wnmu-manual-program-overrides.v1.5.108.js)" -eq 58161
          node --check wnmu-cell-interactions.v1.5.108.js
          node --check wnmu-manual-program-overrides.v1.5.108.js
          grep -q 'wnmu-cell-interactions.v1.5.108.js?v=1.5.108' index131.v1.4.1.html
          grep -q 'wnmu-cell-interactions.v1.5.108.js?v=1.5.108' index133.v1.4.1.html
          grep -q 'wnmu-manual-program-overrides.v1.5.108.js?v=1.5.108' index131.v1.4.1.html
          grep -q 'wnmu-manual-program-overrides.v1.5.108.js?v=1.5.108' index133.v1.4.1.html
          grep -q 'wnmu-auto-tag-helpers.v1.5.96.js?v=1.5.96' index131.v1.4.1.html
          grep -q 'wnmu-auto-tag-helpers.v1.5.96.js?v=1.5.96' index133.v1.4.1.html

      - name: Commit clean release files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v15108-menu.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "WNMU Monthly release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.5.108 deferred menu save update"
          git push origin HEAD:update/v1.5.108-menu-deferred-save
